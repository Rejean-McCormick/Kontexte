[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kontexte"
version = "0.4.0"
description = "Reusable situations and educational projections for Orgo and Ekole"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "License pending: see LICENSE-POLICY.md"}
authors = [{name = "Projet Kontexte"}]
dependencies = []

[project.scripts]
kontexte = "kontexte.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kontexte = ["studio_assets/*.html", "studio_assets/*.css", "studio_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
